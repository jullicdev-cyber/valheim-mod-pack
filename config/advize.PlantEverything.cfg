# Recurring harvest intervals in world-time minutes (PlantEverything 1.21.3).
# Wild and player-placed copies use the same supported resource prefabs.
[Berries]
RaspberryRespawnTime = 45
BlueberryRespawnTime = 45
CloudberryRespawnTime = 45
LingonberryRespawnTime = 45

[Mushrooms]
MushroomRespawnTime = 30
YellowMushroomRespawnTime = 30
BlueMushroomRespawnTime = 30
SmokepuffRespawnTime = 30

[Flowers]
ThistleRespawnTime = 50
DandelionRespawnTime = 50
FiddleheadRespawnTime = 50

[Crops]
# Mistlands mushroom growth is handled narrowly by RenewableResourceTimers.
EnableCropOverrides = false

[Vines]
# RenewableResourceTimers sets berry regrowth without changing vine growth/spacing.
EnableVineOverrides = false
