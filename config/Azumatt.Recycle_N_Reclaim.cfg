# Recycle N Reclaim 1.4.5: manual workstation reclaim for this pack.
[1 - General]
Lock Configuration = On
Apply Crafted By = On

[2 - Inventory Recycle]
Enabled = Off
Lock to Admin = On
DiscardHotkey(s) = None
TrashingKeybind = None
TrashingModifierKeybind1 = None
DisplayTooltipHint = false
ShowRecycleYieldInTooltip = false

[3 - Reclaiming]
RecyclingRate = 0.5
RequireExactCraftingStationForRecycling = On
AllowRecyclingUnknownRecipes = Off
ReturnEnchantedResources = On
PreventZeroResourceYields = On
UnstackableItemsAlwaysReturnAtLeastOneResource = On
# Upstream undo recreates the prefab without custom item data (e.g. Epic Loot).
UndoRecycleKeybind = None
UndoRecycleGracePeriodSeconds = 0

[4 - UI]
ContainerRecyclingEnabled = Off
EnableExperimentalCraftingTabUI = On
HideRecipesForEquippedItems = On
IgnoreItemsOnHotbar = On
NotifyOnSalvagingImpediments = On
StationFilterEnabled = On
StationFilterList = piece_cauldron
RecipeListScrollSpeedMultiplier = 10
