# Metals and ores: additional x4. Wood and stone remain x3. World resource rate multiplies these values.
# Wood multiplier x3 (was x1.5): double the previous yield; world Resources x2 gives x6 total.
# Entries are repeated across biome sections because the mod discovers the earliest source biome at runtime.
# Only the actual bound section for each item is used; multipliers do not stack.
