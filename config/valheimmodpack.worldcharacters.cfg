[General]
# Multiplayer hosts and existing protected world/character records stay protected.
# This option enrolls new solo world/character pairs; false keeps their native characters.
ProtectSoloWorlds = false

[Saving]
# Full native player state + world map/bed/logout position, persisted on the host.
SnapshotSeconds = 5

[Controls]
# Local host requests window: Ctrl+F4. Rebind in Bindrune.
OpenAdministration = F4 + LeftControl
