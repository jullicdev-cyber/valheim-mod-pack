# AutomaticFuel 1.5.1: kiln ground output -> nearby smelter, without manual transfer.
# Defaults Enabled and IsOn remain true in the author's unnamed section.
[1 - General]
Lock Configuration = On

[General]
DropRange = 5
Use Dropped Items for Fuel = true
# Avoid PlantEasily's F10; automation stays on without a toggle shortcut.
ToggleKey = None

[Smelters]
SmelterOreRange = 10
SmelterFuelRange = 10
OreDisallowTypes = RoundLog,FineWood
RestrictKilnOutput = true
RestrictKilnOutputAmount = 100
DistributedFueling = true
# Keep chest samples so AzuAutoStore can continue collecting matching items.
LeaveLastItem = true
AllowStackSmelters = false
BlastFurnaceTakesAll = false
Turn Off Kiln = false
# These two machines retain their existing Valheim Plus settings.
Turn Off Windmills = true
Turn Off SpinningWheel = true

[Fireplace]
FireplaceRange = 10
FuelDisallowTypes = RoundLog,FineWood
RefuelStandingTorches = true
RefuelBraziers = true
RefuelWallTorches = true
RefuelFirePits = true
RefuelHearth = true
RefuelHotTub = false
