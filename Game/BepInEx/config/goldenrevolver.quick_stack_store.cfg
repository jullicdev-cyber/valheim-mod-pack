# Quick Stack Store Sort Trash Restock 1.4.15 / pack 1.3.0.
# Sorting and open-container actions complement AzuAutoStore (K).
# Other settings are generated by the mod with its defaults.

[0 - General]
OverrideHotkeyBarBehavior = NeverAffectHotkeyBar
OverrideButtonDisplay = UseIndividualConfigOptions
OverrideKeybindBehavior = UseIndividualConfigOptions
UseTopDownLogicForEverything = false

[2 - Quick Stacking and Restocking]
AllowAreaStackingInMultiplayerWithoutMUC = false
AllowAreaStackingToNonPhysicalContainers = false
AllowAreaStackingToPhysicalNonPlayerBuiltContainers = false
ToggleAreaStackRestockConfigServerSync = true

[2.1 - Quick Stacking]
DisplayQuickStackButtons = Disabled
QuickStackHotkeyBehaviorWhenContainerOpen = QuickStackOnlyToCurrentContainer
QuickStackKeybind = None
QuickStackIncludesHotkeyBar = false
ChangeHoldToStackFeatureToUseModdedQuickStackingLogic = false

[2.2 - Quick Restocking]
DisplayRestockButtons = Disabled
RestockHotkeyBehaviorWhenContainerOpen = RestockOnlyFromCurrentContainer
RestockKeybind = None
RestockIncludesHotkeyBar = false
RestockOnlyAmmoAndConsumables = true

[3 - Store and Take All]
DisplayStoreAllButton = false
StoreAllKeybind = None
StoreAllIncludesEquippedItems = false
StoreAllIncludesHotkeyBar = false
ChestsUseImprovedTakeAllLogic = false
TakeAllKeybind = None

[4 - Sorting]
AutoSort = Never
DisplaySortButtons = OnlyContainerButton
SortCriteria = Type
SortHotkeyBehaviorWhenContainerOpen = OnlySortContainer
SortInAscendingOrder = true
SortIncludesHotkeyBar = false
SortKeybind = None
SortLeavesEmptyFavoritedSlotsEmpty = true
SortMergesStacks = true

[5 - Trashing]
DisplayTrashCanUI = false
EnableQuickTrash = false
TrashKeybind = None
QuickTrashKeybind = None
TrashingCanAffectHotkeyBar = false
ShowConfirmDialogForNormalItem = Always
ShowConfirmDialogForQuickTrash = true
